<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 30px; }
    table { margin: 20px auto; }
    td {
      width: 60px; height: 60px; border: 2px solid #333;
      font-size: 2em; text-align: center; vertical-align: middle;
      cursor: pointer;
    }
    #status { margin-top: 20px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <table>
    <tr>
      <td onclick="makeMove(0,0)"></td>
      <td onclick="makeMove(0,1)"></td>
      <td onclick="makeMove(0,2)"></td>
    </tr>
    <tr>
      <td onclick="makeMove(1,0)"></td>
      <td onclick="makeMove(1,1)"></td>
      <td onclick="makeMove(1,2)"></td>
    </tr>
    <tr>
      <td onclick="makeMove(2,0)"></td>
      <td onclick="makeMove(2,1)"></td>
      <td onclick="makeMove(2,2)"></td>
    </tr>
  </table>
  <div id="status">Player X's turn</div>
  <button onclick="resetGame()">Restart</button>
  <script>
    let board = [
      ["", "", ""],
      ["", "", ""],
      ["", "", ""]
    ];
    let currentPlayer = "X";
    let gameOver = false;

    function makeMove(row, col) {
      if (board[row][col] === "" && !gameOver) {
        board[row][col] = currentPlayer;
        document.querySelectorAll('tr')[row].children[col].textContent = currentPlayer;
        if (checkWin()) {
          document.getElementById('status').textContent = `Player ${currentPlayer} wins!`;
          gameOver = true;
        } else if (isBoardFull()) {
          document.getElementById('status').textContent = "It's a draw!";
          gameOver = true;
        } else {
          currentPlayer = currentPlayer === "X" ? "Y" : "X";
          document.getElementById('status').textContent = `Player ${currentPlayer}'s turn`;
        }
      }
    }
    function checkWin() {
      for (let i = 0; i < 3; i++) {
        if (board[i][0] && board[i][0] === board[i][1] && board[i][1] === board[i][2]) return true;
        if (board[0][i] && board[0][i] === board[1][i] && board[1][i] === board[2][i]) return true;
      }
      if (board[0][0] && board[0][0] === board[1][1] && board[1][1] === board[2][2]) return true;
      if (board[0][2] && board[0][2] === board[1][1] && board[1][1] === board[2][0]) return true;
      return false;
    }
    function isBoardFull() {
      return board.flat().every(cell => cell);
    }
    function resetGame() {
      board = [
        ["", "", ""],
        ["", "", ""],
        ["", "", ""]
      ];
      currentPlayer = "X";
      gameOver = false;
      document.getElementById('status').textContent = "Player X's turn";
      Array.from(document.querySelectorAll('td')).forEach(td => td.textContent = "");
    }
  </script>
</body>
</html>
